name: Release web build

# Run by hand, or push a tag such as web-v0.2.0. Attaches print-factory-web-<version>.zip,
# the static app that Generator Library installs as a release bundle.
on:
  workflow_dispatch:
  push:
    tags: ['web-v*']
    branches: [claude/project-thread-34ad94] # TEMPORARY: review build before merge

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - name: Zip
        id: zip
        run: |
          version=$(node -p "require('./package.json').version")
          name="print-factory-web-${version}.zip"
          (cd dist && zip -qr "../${name}" .)
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "tag=web-v${version}" >> "$GITHUB_OUTPUT"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.zip.outputs.tag }}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --target "$GITHUB_SHA" --title "Print Factory ${tag#web-v}" --notes "Static web build. Unzip and open index.html through any local web server, or install it with Generator Library."
          gh release upload "$tag" "${{ steps.zip.outputs.name }}" --clobber
