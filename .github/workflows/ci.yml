name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Registry, types and tests
        run: pnpm check
      - name: Build the hub
        run: pnpm build
      - name: Install Chromium for the browser check
        run: |
          npm install -g playwright@1.56.1
          npx -y playwright@1.56.1 install --with-deps chromium
      - name: Browser check (every module builds, draws and exports)
        run: NODE_PATH="$(npm root -g)" node tools/browser-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-check
          path: test-results/
          retention-days: 7
